<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | CV & Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Sarabun:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const template = params.get('template') || localStorage.getItem('forma_selected_template') || 'resume-professional';
        localStorage.setItem('forma_selected_template', template);
        window.resumeStorageKey = 'forma_resume_data_' + template;
        document.documentElement.dataset.template = template;
      })();
    </script>
</head>

<body>

    <header class="site-header">
        <div class="container header-grid">
            <div>
                <h1 id="res-name" class="name">Your Name</h1>
                <p id="res-title" class="header-title">Professional Title</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-print" onclick="editProfile()">
                    <i data-lucide="edit" style="width:18px"></i> EDIT PROFILE
                </button>
                <button class="btn-print" onclick="exportPDF()">
                    <i data-lucide="download" style="width:18px"></i> EXPORT PDF
                </button>
            </div>
        </div>
    </header>

    <main class="container main-grid">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="profile-card">
                <div id="res-avatar" class="avatar">YN</div>
                <h3 id="res-profile-name" style="margin:0">Your Name</h3>
                <p id="res-profile-handle" style="color:var(--accent); font-size:13px; margin:5px 0 20px">@your-profile</p>

                <div class="section-title"><i data-lucide="user"></i> ติดต่อ</div>
                <ul class="contact-list">
                    <li><i data-lucide="mail"></i> <a id="res-email" href="mailto:contact@example.com">contact@example.com</a></li>
                    <li><i data-lucide="smartphone"></i> <a id="res-phone" href="tel:+66000000000">+66 00-000-0000</a>
                    </li>
                    <li><i data-lucide="map-pin"></i> <span id="res-location-sidebar">City, Country</span></li>
                </ul>

                <div class="section-title"><i data-lucide="code"></i> ทักษะทางเทคนิค</div>
                <ul class="skill-list" id="skills-render">
                    <!-- JS rendering -->
                </ul>

                <div class="section-title"><i data-lucide="settings"></i> เครื่องมือที่ใช้</div>
                <ul class="skill-list" id="tools-render">
                    <!-- JS rendering -->
                </ul>

                <div class="section-title"><i data-lucide="users"></i> ทักษะส่วนตัว</div>
                <ul class="skill-list" id="soft-skills-render">
                    <!-- JS rendering -->
                </ul>
            </div>

            <div class="profile-card" style="text-align: left; padding: 24px;">
                <div class="section-title" style="margin-top:0"><i data-lucide="graduation-cap"></i> การศึกษา</div>
                <div id="education-render"></div>
            </div>
        </aside>

        <!-- Main Content -->
        <section class="content">

            <div id="res-summary" class="summary-box">
                <!-- JS rendering -->
            </div>

            <h2><i data-lucide="briefcase"></i> ประสบการณ์ทำงาน</h2>
            <div id="experience-render">
                <!-- JS rendering -->
            </div>

            <h2 style="margin-top:50px"><i data-lucide="layout"></i> ผลงานโปรเจกต์</h2>
            <div class="project-grid" id="projects-render">
                <!-- JS rendering -->
            </div>
        </section>
    </main>

    <footer class="container"
        style="padding: 40px 0; text-align: center; color: var(--muted); font-size: 12px; border-top: 1px solid rgba(255,255,255,0.05)">
        <p>© 2026 Forma — CV & Resume Builder</p>
    </footer>

    <script src="https://unpkg.com/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
